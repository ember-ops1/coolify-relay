name: Coolify Relay Node

on:
  workflow_dispatch:
    inputs:
      cycle_count:
        description: 'Relay cycle counter'
        required: false
        default: '0'
        type: string
      retry_depth:
        description: 'Pre-warming circuit breaker retry depth'
        required: false
        default: '0'
        type: string
      test_handover:
        description: 'Test mode: hand over after X minutes (0 for normal 330m)'
        required: false
        default: '0'
        type: string

jobs:
  coolify-relay:
    name: Run Persistent Coolify Relay Node
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Orchestration Repository
        uses: actions/checkout@v4

      # =====================================================================
      # PHASE 1: PRE-WARMING (Predecessor is active and handling live traffic)
      # =====================================================================
      - name: Bootstrap System, Dependencies & Pre-Warm State
        id: prewarm
        env:
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
        run: |
          set -euo pipefail
          echo "=== PHASE 1: Pre-Warming System, Local Images & Baseline State ==="

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl jq rclone netcat-openbsd sqlite3 dnsutils ca-certificates openssh-server

          # Install cloudflared
          echo "Installing Cloudflare Tunnel client (cloudflared)..."
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared noble main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflared

          # Restore Rclone configuration
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_BASE64" ]; then
            echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
            echo "Rclone credentials restored."
          fi

          TARGET="${STORAGE_TARGET:-b2:coolify-relay-state/coolify-state}"

          # Baseline directory initialization
          sudo mkdir -p /data/coolify /var/lib/docker/volumes /etc/cloudflared

          # Non-destructive pre-warming extraction
          if rclone ls "${TARGET}/coolify_bundle.tar.gz" >/dev/null 2>&1; then
            echo "Pre-warming baseline files from B2..."
            rclone cat "${TARGET}/coolify_bundle.tar.gz" | sudo tar --numeric-owner -xpzf - -C /data/coolify 2>/dev/null || true
          fi

          if rclone ls "${TARGET}/volumes_bundle.tar.gz" >/dev/null 2>&1; then
            echo "Pre-warming Docker volumes from B2..."
            rclone cat "${TARGET}/volumes_bundle.tar.gz" | sudo tar --numeric-owner -xpzf - -C /var/lib/docker/volumes 2>/dev/null || true
          fi

          # Pre-pull standard Coolify container images to eliminate takeover delay
          echo "Pre-pulling core Coolify container images (latest)..."
          sudo docker pull ghcr.io/coollabsio/coolify:latest || true
          sudo docker pull ghcr.io/coollabsio/coolify-helper:latest || true
          sudo docker pull traefik:v3.1 || sudo docker pull traefik:v3.0 || true
          sudo docker pull postgres:16-alpine || true
          sudo docker pull redis:alpine || true

          # If this is a completely fresh first run without existing state, install Coolify baseline
          if [ ! -f "/data/coolify/source/docker-compose.yml" ]; then
            echo "No prior state found. Bootstrapping official Coolify environment..."
            curl -fsSL https://cdn.coollabs.io/coolify/install.sh | sudo bash -s -- -f || true

            if [ -f "/data/coolify/source/.env" ]; then
              sudo sed -i 's|^APP_URL=.*|APP_URL=https://coolify.justsawyou.cyou|g' /data/coolify/source/.env 2>/dev/null || true
              if ! grep -q 'APP_URL=' /data/coolify/source/.env; then
                echo "APP_URL=https://coolify.justsawyou.cyou" | sudo tee -a /data/coolify/source/.env >/dev/null
              fi
            fi

            # Wait for background installation helper to initialize Docker containers
            echo "Awaiting Coolify container stack initialization..."
            for sec in {1..90}; do
              if sudo docker ps --format '{{.Names}}' | grep -q 'coolify'; then
                echo "Coolify containers successfully spun up!"
                break
              fi
              sleep 2
            done
          fi

          echo "Pre-warming completed successfully."

      # =====================================================================
      # CIRCUIT BREAKER: Dispatches fallback if Phase 1 failed
      # =====================================================================
      - name: Circuit Breaker on Pre-Warming Failure
        if: failure() && steps.prewarm.outcome == 'failure'
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          RETRY_DEPTH: ${{ github.event.inputs.retry_depth }}
          TEST_HANDOVER: ${{ github.event.inputs.test_handover }}
        run: |
          echo "=== CIRCUIT BREAKER TRIGGERED ==="
          echo "Pre-warming failed. Predecessor is untouched and still serving."

          DEPTH=${RETRY_DEPTH:-0}
          if [ "$DEPTH" -ge 2 ]; then
            echo "Max retry depth ($DEPTH) reached. Halting automatic failover to prevent ring loop."
            exit 1
          fi

          NEW_DEPTH=$((DEPTH + 1))
          echo "Executing fallback dispatch to next ring node with retry_depth=${NEW_DEPTH}..."

          REPOS=(
            "ember-ops1/coolify-relay"
            "silver-weaver/coolify-relay"
            "moss-and-wire/coolify-relay"
            "pixel-crafter1/coolify-relay"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done
          [ $CURRENT_INDEX -eq -1 ] && CURRENT_INDEX=0

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          FALLBACK_INDEX=$(( (CURRENT_INDEX + 2) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"

          sleep 20
          GH_TOKEN="$NEXT_PAT" gh workflow run coolify-relay.yml \
            --repo "$PRIMARY_TARGET" \
            -f cycle_count="$CYCLE_COUNT" \
            -f retry_depth="$NEW_DEPTH" \
            -f test_handover="${TEST_HANDOVER:-0}" || \
          GH_TOKEN="$FALLBACK_PAT" gh workflow run coolify-relay.yml \
            --repo "$FALLBACK_TARGET" \
            -f cycle_count="$CYCLE_COUNT" \
            -f retry_depth="$NEW_DEPTH" \
            -f test_handover="${TEST_HANDOVER:-0}" || true

          exit 1

      # =====================================================================
      # PHASE 2 & 3: HANDSHAKE, DELTA INGESTION & TAKEOVER
      # =====================================================================
      - name: Handshake, State Hydration & Cloudflare Ingress Takeover
        env:
          PREV_PAT: ${{ secrets.PREV_PAT }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== PHASE 2 & 3: Handshake, State Hydration & Ingress Claim ==="

          TARGET="${STORAGE_TARGET:-b2:coolify-relay-state/coolify-state}"

          # Check if this is an automated rotation cycle awaiting predecessor sync flag
          if [ "${{ github.event.inputs.cycle_count }}" != "0" ]; then
            echo "Awaiting predecessor delta synchronization lock..."
            for sec in {1..40}; do
              if rclone ls "${TARGET}/control/sync_complete.flag" >/dev/null 2>&1; then
                echo "Predecessor sync_complete flag detected."
                break
              fi
              sleep 3
            done
          fi

          # Incremental delta pull, permission normalization, SSH host injection, and DB restore
          chmod +x scripts/coolify/restore_delta.sh || true
          ./scripts/coolify/restore_delta.sh "$TARGET" || true

          # Clear handshake flag
          rclone delete "${TARGET}/control/sync_complete.flag" 2>/dev/null || true

          # Start Cloudflare Tunnel connector with local wildcard ingress configuration
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "Configuring Cloudflare Tunnel with local wildcard ingress (*.justsawyou.cyou)..."
            sudo mkdir -p /etc/cloudflared

            # Safely generate /etc/cloudflared/credentials.json from CLOUDFLARE_TUNNEL_TOKEN
            python3 -c "import os, base64, json; token = os.environ.get('CLOUDFLARE_TUNNEL_TOKEN', '').strip(); raw = json.loads(base64.b64decode(token)) if token else {}; creds = {'AccountTag': raw.get('a', ''), 'TunnelID': raw.get('t', ''), 'TunnelSecret': raw.get('s', '')}; open('/etc/cloudflared/credentials.json', 'w').write(json.dumps(creds)) if creds.get('TunnelID') else None"
            sudo chmod 600 /etc/cloudflared/credentials.json

            # Copy verified repository wildcard ingress configuration
            sudo cp -f configs/cloudflared/config.yml /etc/cloudflared/config.yml
            sudo chmod 600 /etc/cloudflared/config.yml

            echo "Validating cloudflared ingress configuration..."
            sudo cloudflared tunnel ingress validate --config /etc/cloudflared/config.yml || true

            echo "Launching local-config cloudflared daemon..."
            sudo cloudflared tunnel --config /etc/cloudflared/config.yml run > /tmp/cloudflared.log 2>&1 &
            sleep 4

            # Verify Coolify dashboard readiness on port 8000
            echo "Verifying Coolify dashboard responsiveness on port 8000..."
            COOLIFY_UP=false
            for chk in {1..60}; do
              if curl -fsS -o /dev/null --connect-timeout 2 http://localhost:8000; then
                echo "SUCCESS: Coolify dashboard is alive and responding on port 8000! ($((chk*2))s)"
                COOLIFY_UP=true
                break
              fi
              sleep 2
            done

            if [ "$COOLIFY_UP" != "true" ]; then
              echo "::warning::Coolify port 8000 not responding yet. Inspecting Docker containers:"
              sudo docker ps -a
            fi

            # Export diagnostic snapshot to B2 for instant debugging
            echo "Uploading diagnostics to B2..."
            mkdir -p /tmp/diag
            {
              echo "=== DOCKER CONTAINERS ==="
              sudo docker ps -a
              echo "=== COOLIFY COMPOSE STATUS ==="
              (sudo docker compose --project-directory /data/coolify/source --env-file /data/coolify/source/.env -f /data/coolify/source/docker-compose.yml -f /data/coolify/source/docker-compose.prod.yml ps -a) 2>&1 || true
              echo "=== COOLIFY LOGS ==="
              sudo docker logs --tail 100 coolify 2>&1 || true
              echo "=== COOLIFY-DB LOGS ==="
              sudo docker logs --tail 50 coolify-db 2>&1 || true
              echo "=== CLOUDFLARED LOGS ==="
              cat /tmp/cloudflared.log 2>&1 || true
              echo "=== NETWORK LISTENERS ==="
              sudo ss -tulpn 2>&1 || sudo netstat -tulpn 2>&1 || true
            } > /tmp/diag/diagnostics.txt
            rclone copyto /tmp/diag/diagnostics.txt "${TARGET}/diagnostics.txt" 2>/dev/null || true
          else
            echo "::warning::CLOUDFLARE_TUNNEL_TOKEN not provided; skipping tunnel launch."
          fi

          # Cancel predecessor runner run to release concurrency immediately
          REPOS=(
            "ember-ops1/coolify-relay"
            "silver-weaver/coolify-relay"
            "moss-and-wire/coolify-relay"
            "pixel-crafter1/coolify-relay"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done

          if [ $CURRENT_INDEX -ge 0 ] && [ -n "$PREV_PAT" ]; then
            PREV_INDEX=$(( (CURRENT_INDEX - 1 + ${#REPOS[@]}) % ${#REPOS[@]} ))
            PREV_REPO="${REPOS[$PREV_INDEX]}"
            echo "Checking predecessor repo: ${PREV_REPO}..."

            PREV_RUN_ID=$(GH_TOKEN="$PREV_PAT" gh run list --repo "$PREV_REPO" \
              --json databaseId,status -q '.[] | select(.status=="in_progress") | .databaseId' 2>/dev/null | head -n 1 || echo "")

            if [ -n "$PREV_RUN_ID" ] && [ "$PREV_RUN_ID" != "null" ]; then
              echo "Cancelling predecessor run #${PREV_RUN_ID} on ${PREV_REPO}..."
              GH_TOKEN="$PREV_PAT" gh run cancel "$PREV_RUN_ID" --repo "$PREV_REPO" 2>/dev/null || true
            fi
          fi

      # =====================================================================
      # PHASE 4: 330m PRODUCTION SHIFT & WATCHDOG
      # =====================================================================
      - name: Production Shift & Successor Handover Dispatch
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          TEST_HANDOVER: ${{ github.event.inputs.test_handover }}
        run: |
          set -euo pipefail
          echo "=== PHASE 4: Production Shift Active ==="
          HANDOVER_MINUTE=330
          if [ -n "$TEST_HANDOVER" ] && [ "$TEST_HANDOVER" -gt 0 ] 2>/dev/null; then
            echo ">>> TEST HANDOVER OVERRIDE: ${TEST_HANDOVER} minute(s) <<<"
            HANDOVER_MINUTE=$TEST_HANDOVER
          fi

          TARGET="${STORAGE_TARGET:-b2:coolify-relay-state/coolify-state}"
          ELAPSED=0

          while [ $ELAPSED -lt $HANDOVER_MINUTE ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 1))

            # Continuous SSH Key Synchronization from Coolify container / volume into host authorized_keys
            # Ensures newly generated or uploaded keys inside Coolify are immediately valid on the host
            sudo docker exec coolify cat /var/www/html/storage/app/ssh/keys/id_ed25519.pub 2>/dev/null | sudo tee -a /root/.ssh/authorized_keys /home/runner/.ssh/authorized_keys >/dev/null || true
            sudo docker exec coolify cat /var/www/html/storage/app/ssh/keys/id_rsa.pub 2>/dev/null | sudo tee -a /root/.ssh/authorized_keys /home/runner/.ssh/authorized_keys >/dev/null || true
            if [ -d "/data/coolify/ssh/keys" ]; then
              for pub in /data/coolify/ssh/keys/*.pub; do
                [ -f "$pub" ] && sudo cat "$pub" | sudo tee -a /root/.ssh/authorized_keys /home/runner/.ssh/authorized_keys >/dev/null || true
              done
            fi

            # Periodic Traefik & Coolify Health Check
            if [ $((ELAPSED % 5)) -eq 0 ]; then
              if ! curl -fsS --connect-timeout 2 http://localhost:8000 >/dev/null 2>&1; then
                echo "[$(date +'%T')] Warning: Local Coolify dashboard unreachable at minute ${ELAPSED}. Restarting Coolify web container..."
                (cd /data/coolify/source && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml restart coolify) || true
              fi
            fi

            # Regular checkpoint delta sync every 15 minutes (Non-destructive, live containers untouched)
            if [ $((ELAPSED % 15)) -eq 0 ]; then
              echo "[$(date +'%T')] Shift Progress: ${ELAPSED}/${HANDOVER_MINUTE}m | Performing incremental backup..."
              sudo tar -cpzf - -C /data/coolify \
                --exclude="proxy/certs/**" --exclude="**/*.log" . | rclone rcat "${TARGET}/coolify_bundle.tar.gz" 2>/dev/null || true
            fi
          done

          echo "=== HANDOVER THRESHOLD REACHED (Minute ${HANDOVER_MINUTE}) ==="
          REPOS=(
            "ember-ops1/coolify-relay"
            "silver-weaver/coolify-relay"
            "moss-and-wire/coolify-relay"
            "pixel-crafter1/coolify-relay"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done
          [ $CURRENT_INDEX -eq -1 ] && CURRENT_INDEX=0

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          FALLBACK_INDEX=$(( (CURRENT_INDEX + 2) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"
          NEXT_CYCLE=$((CYCLE_COUNT + 1))

          dispatch_runner() {
            local target="$1"
            local token="$2"
            for attempt in 1 2 3 4; do
              echo "Dispatch attempt $attempt to ${target}..."
              if GH_TOKEN="$token" gh workflow run coolify-relay.yml \
                --repo "$target" \
                -f cycle_count="$NEXT_CYCLE" \
                -f retry_depth="0" \
                -f test_handover="${TEST_HANDOVER:-0}"; then
                echo "Successfully triggered workflow on ${target}."
                return 0
              fi
              sleep 15
            done
            return 1
          }

          echo "Dispatching successor runner to ${PRIMARY_TARGET}..."
          if ! dispatch_runner "$PRIMARY_TARGET" "$NEXT_PAT"; then
            echo "Primary dispatch failed. Activating fallback: ${FALLBACK_TARGET}..."
            dispatch_runner "$FALLBACK_TARGET" "$FALLBACK_PAT" || echo "CRITICAL: All dispatches failed!"
          fi

          echo "Successor dispatched! Awaiting Phase 1 pre-warm (180s)..."
          sleep 180

          echo "Executing Final Freeze & Delta Sync..."
          chmod +x scripts/coolify/sync_delta.sh || true
          ./scripts/coolify/sync_delta.sh "$TARGET" || true

          # Release Cloudflare Tunnel connector BEFORE signaling completion
          echo "Releasing Cloudflare Tunnel connector to prevent round-robin collision..."
          sudo pkill -SIGTERM cloudflared 2>/dev/null || true

          # Signal successor to takeover
          rclone touch "${TARGET}/control/sync_complete.flag" 2>/dev/null || true

          # Await successor handshake clearance (up to 3 minutes)
          echo "Handshake flag set. Awaiting successor to acknowledge and claim state..."
          for check in {1..36}; do
            if ! rclone ls "${TARGET}/control/sync_complete.flag" >/dev/null 2>&1; then
              echo "Successor has claimed the delta flag! Exiting gracefully..."
              break
            fi
            sleep 5
          done

          echo "Handover complete! Outgoing node entering standby (max 5m)..."
          for wait_min in {1..5}; do
            sleep 60
          done
          echo "Standby expired. Self-terminating to free runner concurrency."
          exit 0

      # =====================================================================
      # PHASE 5: TEARDOWN
      # =====================================================================
      - name: Final Teardown Safety Check
        if: always()
        env:
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
        run: |
          echo "=== PHASE 5: Teardown & Clean Exit ==="
          sudo pkill -SIGTERM cloudflared 2>/dev/null || true
          (cd /data/coolify/source 2>/dev/null && sudo docker compose down -t 2) || true
          echo "Node shutdown clean."
